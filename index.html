<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MatatuLink</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 9'><text y='8' font-size='8'>🚌</text></svg>">
<style>
:root{--bg:#fffaf0;--fg:#1a1a24;--card:#fff;--mut:#5b5b6b;--ac:#ff3d7f;--ac2:#00a86b;--ac3:#ffc400;--bd:#e6dfcf}
:root[data-t=dark]{--bg:#12121a;--fg:#f4f1ea;--card:#1d1d29;--mut:#aaa8b8;--bd:#33334a}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);padding-top:env(safe-area-inset-top)}
a{color:inherit}h1,h2,h3{line-height:1.15}h1{font-size:clamp(2rem,6vw,3.4rem);margin:.2em 0}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:4px solid var(--ac);display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem 1rem}
.logo{font-weight:900;font-size:1.4rem;text-decoration:none}.logo b{color:var(--ac)}nav{display:flex;flex-wrap:wrap;gap:.2rem;flex:1}nav a{padding:.4rem .6rem;text-decoration:none;border-radius:8px}nav a:hover,nav a:focus-visible{background:var(--ac3);color:#000}
button,.btn{font:inherit;font-weight:700;border:2px solid var(--fg);background:var(--ac3);color:#000;padding:.55rem 1rem;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s}
button:hover,.btn:hover{transform:translateY(-2px)}.p{background:var(--ac);color:#fff}.g{background:var(--ac2);color:#fff}.l{background:transparent;color:var(--fg)}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:1rem;animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.hero{background:repeating-linear-gradient(-45deg,var(--ac) 0 18px,#ff7a00 18px 36px);color:#fff;border-radius:18px;padding:1.5rem;text-shadow:0 2px 0 #0004}
.sb{background:var(--card);color:var(--fg);text-shadow:none;border-radius:14px;padding:1rem;display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:1rem}
label{font-size:.85rem;font-weight:700;display:grid;gap:.2rem}input,select,textarea{font:inherit;padding:.5rem;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.card{background:var(--card);border:2px solid var(--bd);border-radius:14px;overflow:hidden;position:relative}.card .in{padding:.8rem}
.card svg,.gal svg,.gal img{width:100%;height:auto;display:block}.card img{width:100%;aspect-ratio:2/1;object-fit:cover}
.tag{display:inline-block;background:var(--ac2);color:#fff;border-radius:99px;padding:.1rem .6rem;font-size:.75rem;font-weight:700}.tag.w{background:#b45309}
.price{font-weight:900;font-size:1.2rem;color:var(--ac)}.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.two{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--bd);padding:.4rem;text-align:left}.mut{color:var(--mut)}.heart{position:absolute;top:8px;right:8px;background:#fff;border-radius:50%;padding:.2rem .5rem}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.7rem 1rem;border-radius:10px;z-index:9;display:none}
.err{color:#d00;font-size:.85rem}.box{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:1rem;margin:.6rem 0}
.lb{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:8;padding:1rem}.lb>*{max-width:900px;width:100%;background:#fff;border-radius:12px}
footer{text-align:center;padding:2rem;color:var(--mut)}details{margin:.4rem 0}summary{cursor:pointer;font-weight:700}
</style></head><body>
<header><a class="logo" href="#/">Matatu<b>Link</b></a><nav aria-label="Main" id="nav"></nav>
<button class="l" id="lang" aria-label="Language">SW</button><button class="l" id="th" aria-label="Toggle dark mode">🌓</button><span id="usr"></span></header>
<main id="app" tabindex="-1" aria-live="polite"></main><div id="toast" role="status"></div>
<footer>© MatatuLink · Demo. All payments &amp; messages are simulated. <a href="#/terms">Terms</a> · <a href="#/about">About/Safety</a></footer>
<script>
const $=s=>document.querySelector(s),KEY='ml_db_v1',FEE=.05;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kes=n=>'KES '+Math.round(n).toLocaleString('en-KE');
const TR={sw:{Browse:'Vyombo',Pricing:'Bei',Terms:'Masharti',About:'Kuhusu',Owner:'Mmiliki',Bookings:'Nafasi Zangu',Search:'Tafuta',hero:'Kodi matatu moja kwa moja kutoka kwa mmiliki'},en:{hero:'Hire a matatu directly from the owner'}};
const t=k=>(TR[S.lang]||{})[k]||k;
// ---- data layer (swap these for Supabase/Firebase calls) ----
const DB={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}},save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage full: remove some photos')}}};
function art(c,type,seats){const w=type==='Van'?150:type==='Bus'?230:190;return `<svg viewBox="0 0 300 150" role="img" aria-label="${esc(type)} illustration, ${seats} seats"><rect width="300" height="150" fill="${c[2]}"/><rect x="${150-w/2}" y="40" width="${w}" height="70" rx="12" fill="${c[0]}"/><rect x="${150-w/2}" y="78" width="${w}" height="14" fill="${c[1]}"/>${[0,1,2,3].map(i=>`<rect x="${150-w/2+14+i*(w-28)/4}" y="50" width="${(w-40)/4}" height="22" rx="3" fill="#bfe9ff"/>`).join('')}<circle cx="${150-w/2+36}" cy="112" r="14" fill="#222"/><circle cx="${150+w/2-36}" cy="112" r="14" fill="#222"/><text x="150" y="30" text-anchor="middle" font-family="Impact,sans-serif" font-size="20" fill="#fff" stroke="#000" stroke-width=".6">${seats} SEATER</text></svg>`}
function seed(){const P=[['#ff3d7f','#ffc400','#2b1055'],['#00a86b','#fff','#0b3d2e'],['#2979ff','#ffc400','#10213f'],['#ff7a00','#222','#3a1c00'],['#8e24aa','#00e5ff','#1a0a2e'],['#d50000','#fff','#2a0a0a']];
const V=[['Nairobi Express 14','Matatu',14,'day',16000,'Nairobi CBD'],['Kasarani Flash','Matatu',14,'day',14500,'Kasarani'],['Rongai Royal','Matatu',14,'km',90,'Ongata Rongai'],['Thika Road Beast','Minibus',33,'day',32000,'Thika'],['Karen Cruiser','Minibus',25,'hour',3500,'Karen'],['Embakasi Pride','Minibus',29,'day',27000,'Embakasi'],['Highway King 51','Bus',51,'day',55000,'Nairobi CBD'],['Westlands Shuttle','Bus',51,'km',150,'Westlands'],['Toyota HiAce Gold','Van',9,'day',11000,'Kilimani'],['Nissan Caravan Pearl','Van',12,'day',12500,'Lang\'ata'],['Naivasha Tour Bus','Minibus',33,'fixed',45000,'Nairobi CBD'],['Airport Transfer Van','Van',9,'fixed',4500,'Embakasi'],['Kitengela Sacco 14','Matatu',14,'day',15000,'Kitengela']];
const am=['Music system','AC','TV','Charging ports','Luggage rack','WiFi'];
S.users=[{id:'o1',name:'James Mwangi',role:'owner',phone:'+254712345678',verified:true},{id:'o2',name:'Grace Achieng',role:'owner',phone:'+254722111222',verified:true},{id:'o3',name:'Ali Hassan',role:'owner',phone:'+254733999888',verified:false},{id:'c1',name:'Wanjiru Kamau',role:'customer',phone:'+254700111333'},{id:'a1',name:'Admin',role:'admin'}];
S.vehicles=V.map((v,i)=>({id:'v'+i,owner:'o'+(1+i%3),name:v[0],type:v[1],seats:v[2],model:v[3],rate:v[4],loc:v[5],amen:am.filter((_,j)=>(i+j)%3!==0),driver:true,fuel:i%2?'Customer pays fuel':'Fuel included',cap:200,excess:60,wait:1500,deposit:30,blocked:[],col:P[i%6],imgs:[],created:i,desc:`Well-kept ${v[1].toLowerCase()} with NTSA-licensed PSV driver. Ideal for weddings, school trips, church groups and corporate shuttles around ${v[5]}.`}));
S.vehicles.forEach(v=>v.blocked.push(new Date(Date.now()+86400000*(3+v.created%5)).toISOString().slice(0,10)));
const rv=['Smooth ride, driver was punctual.','Great sound system for our wedding party!','Clean bus, fair price. Recommended.','Slightly late but communicated well.'];
S.reviews=[];S.vehicles.forEach((v,i)=>{for(let k=0;k<2;k++)S.reviews.push({id:'r'+i+k,v:v.id,by:['Peter O.','Mary W.','Kevin M.'][(i+k)%3],stars:4+((i+k)%2),text:rv[(i+k)%4]})});
S.bookings=[{id:'b1',ref:'ML-1001',v:'v0',cust:'c1',name:'Wanjiru Kamau',phone:'+254700111333',from:'Nairobi CBD',to:'Naivasha',date:'2026-09-10',qty:2,pax:12,total:35000,status:'completed',reviewed:false},{id:'b2',ref:'ML-1002',v:'v2',cust:'c1',name:'Wanjiru Kamau',phone:'+254700111333',from:'Rongai',to:'Nakuru',date:'2026-10-20',qty:160,pax:10,total:16000,status:'pending',reviewed:false}];}
let S=DB.load();if(!S){S={lang:'en',theme:'light',user:null,wish:[],cmp:[],notes:[]};seed();DB.save()}
document.documentElement.dataset.t=S.theme;
const U=()=>S.users.find(u=>u.id===S.user),V=id=>S.vehicles.find(v=>v.id===id),own=id=>S.users.find(u=>u.id===id);
const rating=id=>{const r=S.reviews.filter(x=>x.v===id);return r.length?(r.reduce((a,x)=>a+x.stars,0)/r.length):0};
const unit={day:'day',km:'km',hour:'hour',fixed:'trip'};
function est(v,q){const base=v.model==='fixed'?v.rate:v.rate*q.qty,ex=v.model==='day'?Math.max(0,q.km-v.cap*q.qty)*v.excess:0,wait=q.overnight?v.wait*(q.nights||1):0,ad=(q.decor?3000:0)+(q.sound?2000:0),sub=base+ex+wait+ad,fee=sub*FEE,tot=sub+fee;return{base,ex,wait,ad,fee,tot,dep:tot*v.deposit/100}}
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
function note(m){S.notes.unshift({m,at:new Date().toLocaleString()});DB.save()}
function pic(v,i=0){return v.imgs[i]?`<img src="${esc(v.imgs[i])}" alt="${esc(v.name)} photo ${i+1}">`:art(v.col,v.type,v.seats)}
function vcard(v){const o=own(v.owner),r=rating(v.id),w=S.wish.includes(v.id);return `<article class="card">${pic(v)}<button class="heart l" data-w="${v.id}" aria-pressed="${w}" aria-label="Save ${esc(v.name)}">${w?'♥':'♡'}</button><div class="in"><h3><a href="#/v/${v.id}">${esc(v.name)}</a></h3><div class="row"><span class="tag${o.verified?'':' w'}">${o.verified?'✔ Verified':'Pending'}</span><span>★ ${r.toFixed(1)}</span><span class="mut">${v.seats} seats · ${esc(v.loc)}</span></div><div class="price">${kes(v.rate)}/${unit[v.model]}</div><label class="row"><input type="checkbox" data-c="${v.id}" ${S.cmp.includes(v.id)?'checked':''} style="width:auto"> Compare</label></div></article>`}
function calendar(v){const d=new Date(),out=[];for(let i=0;i<28;i++){const x=new Date(d.getTime()+i*864e5).toISOString().slice(0,10),b=v.blocked.includes(x)||S.bookings.some(k=>k.v===v.id&&k.date===x&&k.status==='accepted');out.push(`<span title="${x}" style="padding:.3rem;border-radius:6px;font-size:.75rem;background:${b?'#d00':'var(--ac2)'};color:#fff">${x.slice(5)}${b?' ✕':''}</span>`)}return `<div class="row" role="img" aria-label="Availability next 28 days; red is unavailable">${out.join('')}</div>`}
const R={};
R['']=()=>{const f=S.vehicles.slice(0,6).map(vcard).join('');return `<section class="hero"><h1>${t('hero')}</h1><p>Nairobi's matatu marketplace. Pay with M-Pesa. No middlemen.</p>
<form class="sb" id="sf" aria-label="Search vehicles"><label>Pickup<input name="from" required placeholder="e.g. Karen"></label><label>Destination<input name="to" placeholder="e.g. Naivasha"></label><label>Date<input type="date" name="date" min="${new Date().toISOString().slice(0,10)}"></label><label>Passengers<input type="number" name="pax" min="1" max="60" value="14"></label><label>Trip<select name="tt"><option>One way</option><option>Round trip</option></select></label><button class="p" style="align-self:end">${t('Search')}</button></form></section>
<h2>Event shortcuts</h2><div class="row">${['Wedding','School trip','Funeral','Church','Tour','Sports team','Corporate shuttle'].map(e=>`<a class="btn l" href="#/browse?ev=${e}">${e}</a>`).join('')}</div>
<h2>Featured vehicles</h2><div class="grid">${f}</div>
<h2>How it works</h2><div class="grid"><div class="box"><h3>1. Search</h3>Pick trip details and compare vehicles.</div><div class="box"><h3>2. Request</h3>See a live price, pay a refundable M-Pesa deposit.</div><div class="box"><h3>3. Travel</h3>Owner confirms, you ride, then leave a review.</div></div>
<h2>Trust</h2><div class="row"><span class="tag">✔ NTSA/PSV checked</span><span class="tag">✔ Insurance sticker</span><span class="tag">✔ Inspected</span><span class="tag">✔ Reviews from real trips</span></div>
<h2>Testimonials</h2><div class="grid">${S.reviews.slice(0,3).map(r=>`<blockquote class="box">“${esc(r.text)}”<br><b>${esc(r.by)}</b> ★${r.stars}</blockquote>`).join('')}</div>
<h2>Instant quote</h2><form class="box" id="qf"><div class="row"><label>Route (stops separated by commas)<input name="stops" required placeholder="Rongai, Karen, Naivasha"></label><label>Phone<input name="phone" required placeholder="+2547XXXXXXXX"></label><button class="p">Get quote</button></div><p id="qo" class="mut">Distance estimate uses ~25 km per stop and KES 100/km (simulated).</p></form>
<h2>FAQ</h2><details><summary>Is my money safe?</summary>Only a refundable deposit is paid online; balance goes to the owner on the day.</details><details><summary>Can I bring luggage?</summary>Yes. Allow about 20 kg and one bag per passenger; large loads need a luggage rack or bigger vehicle.</details><details><summary>Can I negotiate?</summary>Owners may accept counter-offers via the quote form or WhatsApp.</details>`};
R.browse=(q)=>{const p=new URLSearchParams(q||'');return `<h1>Browse vehicles</h1><form class="box grid" id="ff"><label>Min seats<select name="cap"><option value="0">Any</option><option>9</option><option>14</option><option>25</option><option>51</option></select></label><label>Max price (KES)<input type="number" name="max" value="${esc(p.get('max')||'')}"></label><label>Location<input name="loc" value="${esc(p.get('from')||'')}"></label><label>Amenity<select name="am"><option value="">Any</option><option>Music system</option><option>AC</option><option>TV</option><option>Charging ports</option><option>Luggage rack</option><option>WiFi</option></select></label><label>Available on<input type="date" name="date" value="${esc(p.get('date')||'')}"></label><label>Sort<select name="sort"><option value="price">Price</option><option value="rating">Rating</option><option value="new">Newest</option></select></label><label class="row"><input type="checkbox" name="ver" style="width:auto"> Verified only</label></form><div id="res" class="grid"></div><div id="cmpbar"></div>`};
function filt(){const f=new FormData($('#ff')),r=$('#res');let a=S.vehicles.filter(v=>v.seats>=+f.get('cap')&&(!f.get('max')||v.rate<=+f.get('max'))&&(!f.get('loc')||v.loc.toLowerCase().includes(f.get('loc').toLowerCase()))&&(!f.get('am')||v.amen.includes(f.get('am')))&&(!f.get('ver')||own(v.owner).verified)&&(!f.get('date')||!v.blocked.includes(f.get('date'))));const s=f.get('sort');a.sort((x,y)=>s==='rating'?rating(y.id)-rating(x.id):s==='new'?y.created-x.created:x.rate-y.rate);r.innerHTML=a.length?a.map(vcard).join(''):'<p class="box">No vehicles match. Try widening your filters.</p>';cmpBar()}
function cmpBar(){const b=$('#cmpbar');if(!b)return;b.innerHTML=S.cmp.length>1?`<div class="box"><h2>Compare</h2><div style="overflow:auto"><table><tr><th></th>${S.cmp.map(i=>`<th>${esc(V(i).name)}</th>`).join('')}</tr>${[['Seats',v=>v.seats],['Price',v=>kes(v.rate)+'/'+unit[v.model]],['Rating',v=>rating(v.id).toFixed(1)],['Amenities',v=>v.amen.join(', ')]].map(([k,fn])=>`<tr><th>${k}</th>${S.cmp.map(i=>`<td>${esc(fn(V(i)))}</td>`).join('')}</tr>`).join('')}</table></div></div>`:''}
R.v=id=>{const v=V(id);if(!v)return '<p class="box">Vehicle not found. <a href="#/browse">Browse</a></p>';const o=own(v.owner),rs=S.reviews.filter(r=>r.v===id),n=Math.max(1,v.imgs.length||3);
const wa=`https://wa.me/${(o.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent('Hi '+o.name+', I am interested in hiring '+v.name+' via MatatuLink.')}`;
return `<div class="two"><div><div class="gal" id="gal">${pic(v)}</div><div class="row">${Array.from({length:n},(_,i)=>`<button class="l" data-lb="${i}" aria-label="View photo ${i+1}">Photo ${i+1}</button>`).join('')}</div></div><div><h1>${esc(v.name)}</h1><p>${esc(v.desc)}</p><p><b>${v.seats}</b> licensed seats. Never exceed this. ${esc(v.type)}, ${esc(v.loc)}.</p><div class="row">${v.amen.map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</div>
<div class="box"><b>Pricing:</b> ${kes(v.rate)}/${unit[v.model]} · ${v.driver?'Driver included':'Self-drive (verified licence)'} · ${esc(v.fuel)}<br>Cap ${v.cap} km/day, excess ${kes(v.excess)}/km · Waiting/overnight ${kes(v.wait)} · Deposit ${v.deposit}% refundable · Service fee 5%</div>
<div class="box"><b>${esc(o.name)}</b> <span class="tag${o.verified?'':' w'}">${o.verified?'✔ Verified owner':'Verification pending'}</span> ★ ${rating(v.id).toFixed(1)} (${rs.length})</div>
<div class="row"><a class="btn p" href="#/book/${v.id}">Request booking</a><a class="btn g" href="tel:${esc(o.phone)}">Call</a><a class="btn" href="${wa}" target="_blank" rel="noopener">WhatsApp</a></div></div></div>
<h2>Availability (next 28 days)</h2>${calendar(v)}<h2>Reviews</h2>${rs.length?rs.map(r=>`<div class="box"><b>${esc(r.by)}</b> ★${r.stars}<br>${esc(r.text)}</div>`).join(''):'<p class="box">No reviews yet. Reviews come only from completed bookings.</p>'}`};
R.book=id=>{const v=V(id);if(!v)return R.v(id);const u=U();return `<h1>Book ${esc(v.name)}</h1><div class="two"><form id="bf" class="box" novalidate><h2>Trip details</h2><label>Customer name<input name="name" required value="${esc(u?.name||'')}"></label><label>Phone (+254…)<input name="phone" required value="${esc(u?.phone||'')}" inputmode="tel"></label><span class="err" data-e="phone"></span><label>Pickup<input name="from" required></label><label>Destination / stops (comma separated)<input name="to" required></label><label>Date<input type="date" name="date" required min="${new Date().toISOString().slice(0,10)}"></label><span class="err" data-e="date"></span><label>${v.model==='fixed'?'Trips':'Quantity ('+unit[v.model]+'s)'}<input type="number" name="qty" min="1" value="1"></label><label>Estimated km<input type="number" name="km" min="0" value="100"></label><label>Passengers (max ${v.seats})<input type="number" name="pax" min="1" value="${Math.min(10,v.seats)}"></label><span class="err" data-e="pax"></span><label class="row"><input type="checkbox" name="overnight" style="width:auto"> Overnight / waiting</label><label class="row"><input type="checkbox" name="decor" style="width:auto"> Wedding decor (+KES 3,000)</label><label class="row"><input type="checkbox" name="sound" style="width:auto"> Extra sound (+KES 2,000)</label><label>Emergency contact (+254…)<input name="emerg"></label><label>Counter-offer total (optional, KES)<input type="number" name="offer" min="0"></label><label class="row"><input type="checkbox" name="agree" style="width:auto"> I accept the <a href="#/terms" target="_blank">Booking Agreement</a></label><span class="err" data-e="agree"></span><button class="p">Request booking</button></form><aside class="box" id="est" aria-live="polite"></aside></div>`};
function estUI(v){const f=new FormData($('#bf')),q={qty:Math.max(1,+f.get('qty')||1),km:+f.get('km')||0,overnight:f.get('overnight'),decor:f.get('decor'),sound:f.get('sound')},e=est(v,q);$('#est').innerHTML=`<h2>Live estimate</h2><table><tr><td>Base</td><td>${kes(e.base)}</td></tr><tr><td>Excess km</td><td>${kes(e.ex)}</td></tr><tr><td>Waiting/overnight</td><td>${kes(e.wait)}</td></tr><tr><td>Add-ons</td><td>${kes(e.ad)}</td></tr><tr><td>Platform fee (5%)</td><td>${kes(e.fee)}</td></tr><tr><th>Total</th><th>${kes(e.tot)}</th></tr><tr><td>Deposit (${v.deposit}%)</td><td>${kes(e.dep)}</td></tr></table>`;return{q,e}}
R.my=()=>{const u=U();if(!u)return login();const bs=S.bookings.filter(b=>b.cust===u.id);return `<h1>My bookings</h1>${bs.length?bs.map(b=>`<div class="box"><b>${esc(b.ref)}</b> · ${esc(V(b.v)?.name)} · ${esc(b.date)} · ${kes(b.total)} <span class="tag">${esc(b.status)}</span><div class="row"><button class="l" data-rc="${b.id}">Receipt</button>${['pending','accepted'].includes(b.status)?`<button class="l" data-cx="${b.id}">Cancel</button>`:''}${b.status==='accepted'?`<button class="g" data-pay="${b.id}">I paid deposit (simulate)</button>`:''}${b.status==='completed'&&!b.reviewed?`<button class="p" data-rv="${b.id}">Leave review</button>`:''}<a class="btn l" href="#/track/${b.ref}">Share trip</a></div></div>`).join(''):'<p class="box">No bookings yet. <a href="#/browse">Find a vehicle</a></p>'}`};
R.track=ref=>{const b=S.bookings.find(x=>x.ref===ref);return b?`<h1>Trip ${esc(ref)}</h1><div class="box">${esc(b.from)} → ${esc(b.to)} on ${esc(b.date)}<br>Vehicle: ${esc(V(b.v)?.name)} · Status: <b>${esc(b.status)}</b><br><span class="mut">Simulated share page. Live GPS needs a backend.</span></div>`:'<p class="box">Trip not found.</p>'};
R.owner=()=>{const u=U();if(!u||u.role!=='owner')return login('owner');const vs=S.vehicles.filter(v=>v.owner===u.id),bs=S.bookings.filter(b=>vs.some(v=>v.id===b.v)),ear=bs.filter(b=>b.status==='completed').reduce((a,b)=>a+b.total*(1-FEE/(1+FEE)),0);
return `<h1>Owner dashboard</h1><div class="box"><b>${esc(u.name)}</b> ${u.verified?'<span class="tag">✔ Verified</span>':'<span class="tag w">Pending admin approval</span>'}<p>Documents checklist (upload simulated): ${['NTSA/PSV licence','Insurance sticker','Inspection certificate','Driver licence & PSV badge','Certificate of good conduct'].map(d=>`<label class="row"><input type="checkbox" style="width:auto"> ${d}</label>`).join('')}</p></div><div class="box">Earnings (completed): <b>${kes(ear)}</b> · Avg rating: ★ ${vs.length?(vs.reduce((a,v)=>a+rating(v.id),0)/vs.length).toFixed(1):'–'}</div>
<h2>Booking requests</h2>${bs.length?bs.map(b=>`<div class="box">${esc(b.ref)} · ${esc(V(b.v).name)} · ${esc(b.name)} ${esc(b.phone)} · ${esc(b.date)} · ${kes(b.total)} ${b.offer?`· Counter-offer ${kes(b.offer)}`:''} <span class="tag">${esc(b.status)}</span><div class="row">${b.status==='pending'?`<button class="g" data-ac="${b.id}">Accept</button><button class="p" data-dc="${b.id}">Decline</button>`:''}${b.status==='paid'?`<button class="g" data-done="${b.id}">Mark completed</button>`:''}</div></div>`).join(''):'<p class="box">No requests yet.</p>'}
<h2>My vehicles</h2>${vs.map(v=>`<div class="box row"><b>${esc(v.name)}</b> ${kes(v.rate)}/${unit[v.model]}<input type="date" data-bd="${v.id}" style="width:auto" aria-label="Block date"><button class="l" data-blk="${v.id}">Block date</button><button class="l" data-del="${v.id}">Delete</button></div>`).join('')||'<p class="box">No vehicles yet.</p>'}
<form id="af" class="box"><h2>Add vehicle</h2><label>Name<input name="name" required></label><label>Type<select name="type"><option>Matatu</option><option>Minibus</option><option>Bus</option><option>Van</option></select></label><label>Licensed seats<input type="number" name="seats" min="4" max="70" required></label><label>Pricing model<select name="model"><option value="day">Per day</option><option value="km">Per km</option><option value="hour">Per hour</option><option value="fixed">Fixed route</option></select></label><label>Rate (KES)<input type="number" name="rate" min="1" required></label><label>Location<input name="loc" required></label><label>Driver<select name="driver"><option value="1">Included</option><option value="">Excluded</option></select></label><label>Fuel policy<input name="fuel" value="Customer pays fuel"></label><label>Deposit %<input type="number" name="deposit" value="30" min="0" max="100"></label><label>Photos (multiple)<input type="file" name="imgs" accept="image/*" multiple></label><label>Amenities<select name="am" multiple size="6">${['Music system','AC','TV','Charging ports','Luggage rack','WiFi'].map(a=>`<option>${a}</option>`).join('')}</select></label><button class="p">Add vehicle</button></form>`};
R.admin=()=>{const u=U();if(!u||u.role!=='admin')return login('admin');return `<h1>Admin</h1>${S.users.filter(x=>x.role==='owner').map(o=>`<div class="box row"><b>${esc(o.name)}</b> <span class="tag${o.verified?'':' w'}">${o.verified?'Verified':'Pending'}</span><button class="l" data-vf="${o.id}">${o.verified?'Revoke':'Approve'}</button></div>`).join('')}<h2>Listings</h2>${S.vehicles.map(v=>`<div class="box row">${esc(v.name)}<button class="l" data-del="${v.id}">Remove listing</button></div>`).join('')}`};
function login(role){return `<h1>Sign in (demo)</h1><p class="mut">Real accounts need a backend. Choose a demo identity.</p><div class="row">${S.users.filter(u=>!role||u.role===role).map(u=>`<button data-li="${u.id}">${esc(u.name)} (${u.role})</button>`).join('')}</div>`}
R.pricing=()=>`<h1>Pricing</h1><p>Owners pick one model per vehicle: per day, per km, per hour or a fixed route price. Your total = base + excess km + waiting/overnight + add-ons + 5% platform fee. A refundable deposit (set by owner, usually 30%) secures the booking via M-Pesa; the balance is paid to the owner on the trip day.</p><table><tr><th>Sample trip</th><th>Model</th><th>Estimate</th></tr><tr><td>14-seater, Nairobi–Naivasha day</td><td>Per day</td><td>${kes(16000*1.05)}</td></tr><tr><td>33-seater school trip, 1 day</td><td>Per day</td><td>${kes(32000*1.05)}</td></tr><tr><td>Van, airport transfer</td><td>Fixed</td><td>${kes(4500*1.05)}</td></tr><tr><td>51-seater, 200 km</td><td>Per km</td><td>${kes(150*200*1.05)}</td></tr></table>`;
R.terms=()=>{const T=[['Eligibility','You must be 18+ with valid ID and a Kenyan phone number to book or list a vehicle.'],['Platform role','MatatuLink is an intermediary. The hire contract is between owner and customer. We do not own, operate or insure vehicles.'],['Owner verification','Owners must provide a valid NTSA/PSV licence, insurance sticker, inspection certificate, driver licence and PSV badge, and certificate of good conduct. Listings stay unverified until approved.'],['Booking & deposit','A booking is confirmed when the owner accepts and the deposit is paid by M-Pesa. Deposits are refundable per the cancellation policy and offset against the final price.'],['Cancellation & refunds','Cancel 72+ hours before: full deposit refund. 24–72 hours: 50%. Under 24 hours or no-show: deposit forfeited to the owner. If the owner cancels, you receive a full refund.'],['Passenger limits','Never exceed the licensed seating capacity. Drivers may refuse to depart if overloaded. Standing passengers are not allowed.'],['Prohibited use','Illegal activity, overloading, hazardous or flammable goods, reckless driving, and carrying contraband are prohibited and void any refund.'],['Fuel & damage','Fuel follows the policy on the listing. The customer is liable for damage caused by passengers beyond normal wear, up to repair cost.'],['Breakdown & substitution','If a vehicle breaks down, the owner must supply a comparable replacement or refund unused portions.'],['Delays','Waiting beyond the agreed time is charged at the listed waiting rate. Traffic delays are not breaches.'],['Disputes','Parties should first resolve disputes through MatatuLink support within 14 days, then mediation, then Kenyan courts.'],['Privacy','We process data per the Kenya Data Protection Act, 2019. Data is used only to deliver bookings and is not sold.'],['Suspension','We may suspend accounts for fraud, unsafe operation, expired documents or repeated complaints.']];return `<h1>Terms of Use & Booking Agreement</h1>${T.map((x,i)=>`<h2>${i+1}. ${x[0]}</h2><p>${x[1]}</p>`).join('')}<p class="box"><b>Not legal advice.</b> Have a Kenyan advocate review these terms before commercial use.</p><button class="l" onclick="print()">Print / save as PDF</button>`};
R.about=()=>`<h1>About, Contact & Safety</h1><p>MatatuLink connects matatu owners directly with customers across Nairobi.</p><h2>Safety</h2><ul><li>Check the verified badge and PSV sticker on arrival.</li><li>Never exceed seat capacity. Seatbelts on.</li><li>Share your trip link and keep an emergency contact.</li></ul><h2>Contact</h2><p>support@matatulink.example · +254 700 000 000 (demo)</p><form class="box" id="cf"><label>Message<textarea required></textarea></label><button class="p">Send</button></form>`;
function route(){const h=location.hash.slice(2),[p,...r]=h.split('/'),[seg,qs]=(r.join('/')||'').split('?'),name=p.split('?')[0];const fn=R[name||''];const a=$('#app');a.innerHTML=fn?(name==='browse'?fn(p.split('?')[1]):fn(seg)):'<p class="box">Page not found. <a href="#/">Home</a></p>';if(name==='browse')filt();if(name==='book'&&V(seg))estUI(V(seg));window.scrollTo(0,0);a.focus();chrome()}
function chrome(){const u=U();$('#nav').innerHTML=[['browse',t('Browse')],['my',t('Bookings')],['owner',t('Owner')],['pricing',t('Pricing')],['terms',t('Terms')],['about',t('About')],['admin','Admin']].map(x=>`<a href="#/${x[0]}">${x[1]}</a>`).join('')+`<a href="#/my" aria-label="Notifications">🔔${S.notes.length}</a>`;$('#usr').innerHTML=u?`${esc(u.name)} <button class="l" id="lo">Out</button>`:''}
addEventListener('hashchange',route);
$('#th').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.t=S.theme;DB.save()};
$('#lang').onclick=()=>{S.lang=S.lang==='en'?'sw':'en';$('#lang').textContent=S.lang==='en'?'SW':'EN';DB.save();route()};
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,fd=new FormData(f);
if(f.id==='sf')location.hash='#/browse?'+new URLSearchParams({from:fd.get('from'),date:fd.get('date')||''});
if(f.id==='qf'){const n=fd.get('stops').split(',').filter(s=>s.trim()).length,km=Math.max(1,n-1)*25*2;$('#qo').textContent=`Estimated ${km} km, about ${kes(km*100)} before fees. An owner will contact ${fd.get('phone')} (simulated).`;}
if(f.id==='cf'){toast('Message sent (simulated)');f.reset()}
if(f.id==='bf'){const v=V(location.hash.split('/')[2]),er={},ph=/^\+254\d{9}$/;f.querySelectorAll('.err').forEach(x=>x.textContent='');if(!ph.test(fd.get('phone')))er.phone='Use +254 followed by 9 digits';if(!fd.get('date'))er.date='Choose a date';else if(v.blocked.includes(fd.get('date')))er.date='Vehicle unavailable that day';if(+fd.get('pax')>v.seats||+fd.get('pax')<1)er.pax='Cannot exceed '+v.seats+' seats';if(!fd.get('agree'))er.agree='You must accept the agreement';
Object.keys(er).forEach(k=>f.querySelector(`[data-e=${k}]`).textContent=er[k]);if(Object.keys(er).length)return;
const{e:E}=estUI(v),u=U(),b={id:'b'+Date.now(),ref:'ML-'+Math.floor(1000+Math.random()*9000),v:v.id,cust:u?.id||'c1',name:fd.get('name'),phone:fd.get('phone'),from:fd.get('from'),to:fd.get('to'),date:fd.get('date'),qty:+fd.get('qty'),pax:+fd.get('pax'),total:E.tot,offer:+fd.get('offer')||0,emerg:fd.get('emerg'),status:'pending',reviewed:false};S.bookings.push(b);note('Booking '+b.ref+' requested');DB.save();
$('#app').innerHTML=`<h1>Request sent ✔</h1><div class="box"><p>Reference: <b>${esc(b.ref)}</b></p><p>Total ${kes(E.tot)}. Deposit due after owner accepts: <b>${kes(E.dep)}</b>.</p><h2>M-Pesa instructions</h2><ol><li>Go to M-Pesa → Lipa na M-Pesa → Paybill</li><li>Business no: <b>400200</b> (demo)</li><li>Account: <b>${esc(b.ref)}</b></li><li>Amount: ${kes(E.dep)}, then enter your PIN</li></ol><p class="mut">Simulated. No real payment is taken.</p><div class="row"><a class="btn p" href="#/my">My bookings</a><button class="l" onclick="print()">Print receipt</button></div></div>`}
if(f.id==='af'){const v={id:'v'+Date.now(),owner:S.user,name:fd.get('name'),type:fd.get('type'),seats:+fd.get('seats'),model:fd.get('model'),rate:+fd.get('rate'),loc:fd.get('loc'),amen:[...f.am.selectedOptions].map(o=>o.value),driver:!!fd.get('driver'),fuel:fd.get('fuel'),cap:200,excess:60,wait:1500,deposit:+fd.get('deposit'),blocked:[],col:['#ff3d7f','#ffc400','#2b1055'],imgs:[],created:Date.now(),desc:'New listing.'};
for(const file of f.imgs.files)v.imgs.push(await shrink(file));S.vehicles.push(v);DB.save();toast('Vehicle added');route()}});
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,800/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};i.onerror=()=>res('');i.src=r.result};r.readAsDataURL(file)})}
document.addEventListener('change',e=>{const c=e.target;if(c.closest('#ff'))filt();if(c.closest('#bf'))estUI(V(location.hash.split('/')[2]));if(c.dataset.c){S.cmp=c.checked?[...S.cmp,c.dataset.c].slice(-3):S.cmp.filter(x=>x!==c.dataset.c);DB.save();cmpBar()}});
document.addEventListener('input',e=>{if(e.target.closest('#bf'))estUI(V(location.hash.split('/')[2]))});
document.addEventListener('click',e=>{const d=e.target.dataset||{},B=id=>S.bookings.find(b=>b.id===id),set=(id,s,m)=>{B(id).status=s;note(m);DB.save();route()};
if(d.w){S.wish=S.wish.includes(d.w)?S.wish.filter(x=>x!==d.w):[...S.wish,d.w];DB.save();e.target.textContent=S.wish.includes(d.w)?'♥':'♡'}
if(d.li){S.user=d.li;DB.save();route()}if(e.target.id==='lo'){S.user=null;DB.save();route()}
if(d.ac)set(d.ac,'accepted','Booking accepted');if(d.dc)set(d.dc,'declined','Booking declined');if(d.cx)set(d.cx,'cancelled','Booking cancelled');if(d.pay)set(d.pay,'paid','Deposit received (simulated)');if(d.done)set(d.done,'completed','Trip completed');
if(d.vf){const o=own(d.vf);o.verified=!o.verified;DB.save();route()}
if(d.del&&confirm('Delete this vehicle?')){S.vehicles=S.vehicles.filter(v=>v.id!==d.del);DB.save();route()}
if(d.blk){const x=document.querySelector(`[data-bd="${d.blk}"]`).value;if(x){V(d.blk).blocked.push(x);DB.save();toast('Date blocked')}}
if(d.rv){const s=+prompt('Rating 1-5',5);if(s>=1&&s<=5){const b=B(d.rv);S.reviews.push({id:'r'+Date.now(),v:b.v,by:b.name,stars:Math.round(s),text:prompt('Your review')||''});b.reviewed=true;DB.save();route()}}
if(d.rc){const b=B(d.rc);document.body.innerHTML=`<main><h1>Receipt ${esc(b.ref)}</h1><p>${esc(b.name)} · ${esc(V(b.v)?.name)} · ${esc(b.from)} → ${esc(b.to)} · ${esc(b.date)}<br>Total ${kes(b.total)} · Status ${esc(b.status)}</p><p>Subject to the MatatuLink Booking Agreement.</p><button onclick="print()">Print</button> <button onclick="location.reload()">Back</button></main>`}
if(d.lb!==undefined){const v=V(location.hash.split('/')[2]),l=document.createElement('div');l.className='lb';l.setAttribute('role','dialog');l.setAttribute('aria-label','Photo viewer');l.innerHTML=pic(v,+d.lb)+'<button style="margin:.5rem">Close (Esc)</button>';l.onclick=()=>l.remove();document.addEventListener('keydown',function k(ev){if(ev.key==='Escape'){l.remove();removeEventListener('keydown',k)}});document.body.append(l)}});
route();
</script></body></html>
